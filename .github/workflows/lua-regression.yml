name: lua-regression

on:
  push:
  pull_request:

jobs:
  lua-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run deterministic Lua/Python regression set
        run: python -B tools/ci_tests.py
      # Native game/JVM validators need Project Zomboid and ZombieBuddy and are
      # intentionally run by tools/Project.ps1 on a development/release machine.
